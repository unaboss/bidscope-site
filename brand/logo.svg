<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <title>Bidscope by North Tech</title>

  <rect x="0" y="0" width="640" height="220" fill="#FFFFFF"/>

  <!-- Mark: a scope / target motif -->
  <g transform="translate(108,110)">
    <circle cx="0" cy="0" r="76" fill="none" stroke="#14375E" stroke-width="9"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#B08D57" stroke-width="6"/>
    <circle cx="0" cy="0" r="11" fill="#14375E"/>

    <!-- crosshair ticks -->
    <line x1="0" y1="-92" x2="0" y2="-68" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="68" x2="0" y2="92" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
    <line x1="-92" y1="0" x2="-68" y2="0" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
    <line x1="68" y1="0" x2="92" y2="0" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>

  </g>

  <!-- Wordmark -->
  <g>
    <text x="212" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#111111" letter-spacing="0.5">Bidscope</text>
    <text x="215" y="163" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B08D57" letter-spacing="2.5">BY NORTH TECH</text>
  </g>
</svg>
