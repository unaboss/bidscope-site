<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="856" viewBox="0 0 1640 856">
  <title>Bidscope — Facebook Page Cover</title>

  <defs>
    <radialGradient id="bgWash" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7EDF3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1640" height="856" fill="url(#bgWash)"/>

  <!-- Decorative corner accents, kept clear of centre and of the lower-left
       corner where Facebook overlaps the profile picture -->
  <g opacity="0.5">
    <path d="M 0 90 L 90 90 L 90 0" fill="none" stroke="#14375E" stroke-width="4"/>
    <path d="M 1640 90 L 1550 90 L 1550 0" fill="none" stroke="#B08D57" stroke-width="4"/>
    <path d="M 1640 766 L 1550 766 L 1550 856" fill="none" stroke="#14375E" stroke-width="4"/>
  </g>

  <!-- Top tagline, well clear of the centred logo -->
  <text x="820" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#B08D57" letter-spacing="4">PROCUREMENT INTELLIGENCE FOR SOUTH AFRICAN BUSINESS</text>

  <!-- Bidscope lockup, centred exactly on the canvas -->
  <g transform="translate(820,428) scale(0.75) translate(-320,-110)">
    <!-- Mark: scope / target motif -->
    <g transform="translate(108,110)">
      <circle cx="0" cy="0" r="76" fill="none" stroke="#14375E" stroke-width="9"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#B08D57" stroke-width="6"/>
      <circle cx="0" cy="0" r="11" fill="#14375E"/>

      <line x1="0" y1="-92" x2="0" y2="-68" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="68" x2="0" y2="92" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
      <line x1="-92" y1="0" x2="-68" y2="0" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
      <line x1="68" y1="0" x2="92" y2="0" stroke="#B08D57" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Wordmark -->
    <g>
      <text x="212" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#111111" letter-spacing="0.5">Bidscope</text>
      <text x="215" y="163" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B08D57" letter-spacing="2.5">BY NORTH TECH</text>
    </g>
  </g>

  <!-- Bottom tagline, well clear of the centred logo -->
  <text x="820" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#14375E" letter-spacing="0.5">Track. Match. Win.</text>
</svg>
