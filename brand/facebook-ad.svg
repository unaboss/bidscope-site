<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>Bidscope by North Tech — Facebook ad</title>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#14375E" flood-opacity="0.18"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="130" y="580" width="820" height="340" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>
  <circle cx="1020" cy="60" r="220" fill="#14375E" opacity="0.05"/>
  <circle cx="30" cy="1040" r="180" fill="#B08D57" opacity="0.06"/>

  <!-- Logo lockup -->
  <g transform="translate(450,118)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#14375E" stroke-width="5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#B08D57" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#14375E"/>
    <line x1="0" y1="-41" x2="0" y2="-31" stroke="#B08D57" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="31" x2="0" y2="41" stroke="#B08D57" stroke-width="4" stroke-linecap="round"/>
    <line x1="-41" y1="0" x2="-31" y2="0" stroke="#B08D57" stroke-width="4" stroke-linecap="round"/>
    <line x1="31" y1="0" x2="41" y2="0" stroke="#B08D57" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="500" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#111111" letter-spacing="0.3">Bidscope</text>
  <text x="502" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#B08D57" letter-spacing="2">BY NORTH TECH</text>

  <!-- Headline -->
  <text x="540" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#14375E">
    <tspan x="540" dy="0">Every South African</tspan>
    <tspan x="540" dy="70">tender that actually</tspan>
    <tspan x="540" dy="70">fits your business.</tspan>
  </text>

  <!-- Supporting line -->
  <text x="540" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#3F4A57">
    <tspan x="540" dy="0">eTenders + SOE + municipal sources, ranked against your</tspan>
    <tspan x="540" dy="34">service lines, provinces and CIDB grades.</tspan>
  </text>

  <!-- Device / dashboard mock -->
  <g filter="url(#softShadow)">
    <rect x="130" y="580" width="820" height="340" rx="24" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="2"/>
  </g>
  <g clip-path="url(#frameClip)">
    <rect x="130" y="580" width="820" height="54" fill="#14375E"/>
    <circle cx="162" cy="607" r="7" fill="#B08D57"/>
    <circle cx="188" cy="607" r="7" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="214" cy="607" r="7" fill="#FFFFFF" opacity="0.45"/>
    <text x="900" y="613" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">Tender Matches</text>
  </g>

  <!-- Row 1 -->
  <rect x="160" y="654" width="760" height="78" rx="14" fill="#F7F6F1"/>
  <text x="186" y="684" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#14375E">City of Tshwane — Road Maintenance</text>
  <text x="186" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6B7280">Gauteng &#183; CIDB 6CE &#183; Civil Engineering</text>
  <circle cx="850" cy="693" r="27" fill="#14375E"/>
  <circle cx="850" cy="693" r="27" fill="none" stroke="#B08D57" stroke-width="3"/>
  <text x="850" y="699" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">94%</text>

  <!-- Row 2 -->
  <rect x="160" y="748" width="760" height="78" rx="14" fill="#F7F6F1"/>
  <text x="186" y="778" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#14375E">Eskom — Substation Refurbishment</text>
  <text x="186" y="802" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6B7280">Mpumalanga &#183; CIDB 7EB &#183; Electrical</text>
  <circle cx="850" cy="787" r="27" fill="#14375E"/>
  <circle cx="850" cy="787" r="27" fill="none" stroke="#B08D57" stroke-width="3"/>
  <text x="850" y="793" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">88%</text>

  <!-- Row 3 -->
  <rect x="160" y="842" width="760" height="78" rx="14" fill="#F7F6F1"/>
  <text x="186" y="872" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#14375E">Dept of Health — Medical Supplies</text>
  <text x="186" y="896" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6B7280">Western Cape &#183; CIDB 4SQ &#183; Supply &amp; Delivery</text>
  <circle cx="850" cy="881" r="27" fill="#14375E"/>
  <circle cx="850" cy="881" r="27" fill="none" stroke="#B08D57" stroke-width="3"/>
  <text x="850" y="887" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">81%</text>

  <!-- CTA button -->
  <rect x="300" y="955" width="480" height="70" rx="35" fill="#14375E"/>
  <rect x="300" y="955" width="480" height="70" rx="35" fill="none" stroke="#B08D57" stroke-width="2"/>
  <text x="540" y="998" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Start your 7-day free trial</text>

  <!-- Footer -->
  <text x="540" y="1055" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#B08D57" letter-spacing="1">bidscope.northtech.africa</text>
</svg>
